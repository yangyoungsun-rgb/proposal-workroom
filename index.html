<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제안 작업실 — 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F4F6FA; --sheet:#FFFFFF; --ink:#1B2134; --slate:#6E7689; --rule:#E5E8EF; --rule-soft:#EEF1F6;
  --navy:#3D85C6; --navy-ink:#2F5FA8; --navy-soft:#EBF2FC; --violet:#6A5ACD; --violet-soft:#F0EEFC;
  --seal:#D2463B; --seal-soft:#FDECEA; --good:#2E8A55; --good-soft:#E9F6EE; --good-line:#BFE3CC;
  --warn:#C27A12; --warn-soft:#FDF3E2; --orange-soft:#FDF0E6;
  --side:#232A42; --side-active:#363F64; --side-ink:#C7CDDD; --side-rule:#363E58;
  --shadow:0 1px 2px rgba(27,33,52,.04),0 4px 14px rgba(27,33,52,.04);
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
svg.i{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 10px;gap:2px;overflow-y:auto}
.brand{padding:0 12px 22px;font-weight:800;font-size:25px;letter-spacing:-0.02em;color:#fff;display:flex;align-items:baseline}
.brand .o{display:inline-block;width:20px;height:20px;border-radius:50%;border:3.5px solid;border-color:#4BA3E3 #4BA3E3 #7CC24E #7CC24E;transform:rotate(-30deg);margin-right:1px;position:relative;top:2px}
.brand-sub{padding:0 12px 18px;margin-top:-16px;font-size:12px;color:var(--side-ink);opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-radius:10px;color:var(--side-ink);font-weight:500;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav .sep{height:1px;background:var(--side-rule);margin:10px 12px}
.nav .lbl{flex:1}
.count{font-size:11.5px;min-width:20px;text-align:center;border-radius:10px;padding:1px 6px;background:var(--seal);color:#fff;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-ink);opacity:.7;padding:14px 12px 4px;border-top:1px solid var(--side-rule)}
main{overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);padding:14px 32px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-height:72px}
.burger{border:0;background:none;color:var(--slate);padding:4px;display:grid;place-items:center}
.topbar .meta{color:var(--slate);font-size:13px}
.dday{font-weight:800;font-size:17px;color:var(--seal);background:var(--seal-soft);padding:2px 10px;border-radius:999px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper);padding:2px}
.seg button{border:0;background:none;padding:4px 14px;font-size:13px;color:var(--slate);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(27,33,52,.12)}
.content{padding:28px 32px 56px;max-width:1320px;width:100%}
h1{font-size:26px;margin:0 0 6px;font-weight:800;letter-spacing:-0.02em}
.lead{color:var(--slate);margin:0 0 22px;font-size:15px}
h2{font-size:16.5px;margin:30px 0 12px;font-weight:700;letter-spacing:-0.01em}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head-row .lead{margin:0}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px 22px}
.card-hd{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--rule-soft)}
.card-hd b{font-size:16.5px;font-weight:700;flex:1}
.card-hd .all{border:0;background:none;color:var(--slate);font-size:13.5px;display:flex;align-items:center;gap:2px}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px;background:var(--navy-soft);color:var(--navy-ink)}
.tile.violet{background:var(--violet-soft);color:var(--violet)} .tile.green{background:var(--good-soft);color:var(--good)}
.tile.orange{background:var(--orange-soft);color:var(--warn)} .tile.red{background:var(--seal-soft);color:var(--seal)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--slate);font-size:12.5px;padding:12px 16px;border-bottom:1px solid var(--rule);background:transparent}
td{padding:14px 16px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper)}
.scroll-x{overflow-x:auto}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:8px 16px;border-radius:10px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.big{padding:12px 20px;font-size:15px;border-radius:10px}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:8px}
.tag{display:inline-block;font-size:12.5px;padding:3px 12px;border-radius:999px;border:1px solid var(--rule);color:var(--slate);white-space:nowrap;font-weight:500}
.tag.s0{background:var(--seal-soft);color:var(--seal);border-color:transparent;font-weight:600}
.tag.s1{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.tag.s2{background:var(--rule-soft);color:var(--slate);border-color:transparent}
.tag.ok{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.tag.navy{background:var(--navy-soft);color:var(--navy-ink);border-color:#CFE0F5}
.muted{color:var(--slate)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:270px 1fr 330px;gap:20px;align-items:start}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}
.row-item{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.row-item:last-child{border-bottom:0}
.row-item:hover{background:var(--paper)}
.row-item .t{flex:1;min-width:0}
.row-item .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .t span{font-size:13px;color:var(--slate)}
.empty{padding:40px 22px;text-align:center;color:var(--slate)}

/* 결재란 */
.rail{display:grid;grid-template-columns:repeat(8,minmax(118px,1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:16px;overflow:hidden;min-width:944px;box-shadow:var(--shadow)}
.cell{border-right:1px solid var(--rule-soft);display:flex;flex-direction:column}
.cell:last-child{border-right:0}
.cell .hd{border-bottom:1px solid var(--rule-soft);text-align:center;padding:10px 4px;font-size:13px;font-weight:700;background:var(--paper)}
.cell .hd span{display:block;font-weight:500;color:var(--slate);font-size:12px}
.cell .bd{height:104px;display:grid;place-items:center;position:relative;cursor:pointer}
.cell .bd:hover{background:var(--paper)}
.cell .ft{border-top:1px solid var(--rule-soft);font-size:12px;text-align:center;padding:6px;color:var(--slate);min-height:30px}
.cell.current .hd{background:var(--navy);color:#fff}
.cell.current .hd span{color:#E3EEFA}
.seal{width:62px;height:62px;border:2.5px solid var(--seal);border-radius:50%;display:grid;place-items:center;color:var(--seal);font-family:var(--serif);font-weight:800;font-size:15px;line-height:1.1;text-align:center;transform:rotate(-8deg)}
.seal small{display:block;font-size:10px;font-family:var(--font);font-weight:600}
.seal.lock{border-radius:8px;border-style:double;border-width:4px}
.seal.fresh{animation:stamp .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-8deg) scale(1.9);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.seal.fresh{animation:none}}
.state{font-size:12.5px;color:var(--slate);text-align:center;line-height:1.4}
.state b{display:block;color:var(--ink);font-weight:700}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat{padding:22px 24px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--paper);top:-60px;right:-50px}
.stat .tile{position:relative;z-index:1;margin-bottom:18px}
.stat .l{font-size:14px;color:var(--slate);position:relative;z-index:1}
.stat .n{font-weight:800;font-size:34px;line-height:1.15;letter-spacing:-0.02em;position:relative;z-index:1}
.stat .n small{font-size:15px;font-weight:500;color:var(--slate);margin-left:4px}
.stat.s0 .n{color:var(--seal)} .stat.s1 .n{color:var(--warn)}

/* slides */
.thumbs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.thumb{flex:0 0 128px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px;text-align:left;font-size:11.5px;position:relative}
.thumb[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.thumb .bar{height:5px;background:var(--navy);width:60%;margin-bottom:6px;border-radius:2px}
.thumb .ln{height:4px;background:var(--rule);margin:4px 0;border-radius:2px}
.thumb .chg{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.thumb .pins{position:absolute;top:14px;right:8px;background:var(--sheet);padding:0 3px;font-size:10.5px;color:var(--seal);font-weight:700}
.slide{aspect-ratio:1/1.414;max-height:560px;margin:0 auto;background:#fff;color:#18212D;border:1px solid var(--rule);border-radius:6px;position:relative;padding:7% 8%;cursor:crosshair;box-shadow:var(--shadow)}
.slide h3{margin:0 0 4px;font-size:18px;color:#2F5FA8}
.slide .claim{font-size:13px;color:#374151;border-left:3px solid #3D85C6;padding-left:8px;margin:10px 0 16px}
.slide .box{border:1px solid #D7DDE6;border-radius:6px;padding:10px;font-size:12px;margin-bottom:10px;color:#374151}
.slide .chips{position:absolute;bottom:4%;left:8%;display:flex;gap:6px;flex-wrap:wrap}
.slide .chips span{font-size:10.5px;background:#EBF2FC;color:#2F5FA8;padding:1px 7px;border-radius:999px}
.slide .hl{background:#FDF3E2;outline:2px dashed #C27A12;outline-offset:2px}
.slide .bad{background:#FDECEA;outline:2px solid #D2463B;outline-offset:2px}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--seal);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pin.minor{background:var(--warn)} .pin.idea{background:var(--slate)} .pin.done{opacity:.4}
.cmt{border-bottom:1px solid var(--rule-soft);padding:12px 0;font-size:13.5px}
.cmt:last-child{border-bottom:0}
.cmt .who{font-weight:700;font-size:13px;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmp .slide{max-height:420px;cursor:default}
del{background:var(--seal-soft);color:var(--seal)} ins{background:var(--good-soft);color:var(--good);text-decoration:none}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.list li:last-child{border-bottom:0}
.check{width:18px;height:18px;border-radius:50%;flex:0 0 18px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.check.y{background:var(--good);color:#fff} .check.n{background:var(--seal);color:#fff} .check.o{border:1.5px solid var(--rule)}
.log{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;height:540px;overflow:hidden}
.chat .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{padding:9px 12px;border-radius:12px;font-size:13.5px;max-width:92%}
.bubble.me{align-self:flex-end;background:var(--navy);color:#fff}
.bubble.sys{background:var(--paper)}
.chat form{display:flex;gap:6px;align-items:center;padding:12px;border-top:1px solid var(--rule)}
.chat form .btn{flex:0 0 auto;white-space:nowrap}
.chat input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--paper)}
.notice{border:1px solid transparent;background:var(--warn-soft);color:var(--ink);padding:12px 16px;border-radius:12px;font-size:13.5px;margin-bottom:14px}
.notice.bad{background:var(--seal-soft)}
.notice.good{background:var(--good-soft)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:13px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--rule);border-radius:10px;padding:9px 12px;background:var(--paper);font-weight:400}
select.btn{padding-right:10px}
dialog{border:1px solid var(--rule);border-radius:16px;background:var(--sheet);color:var(--ink);padding:26px;width:min(480px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(20,25,40,.45)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.phase-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.phase-tabs button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.phase-tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.phase-tabs button:disabled{opacity:.4}
@media (max-width:1150px){.grid3,.cards3{grid-template-columns:1fr}.chat{height:400px}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  aside{flex-direction:row;overflow-x:auto;padding:10px}
  .brand,.brand-sub,.side-foot,.nav .sep{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:8px 12px}
  .grid2,.cmp{grid-template-columns:1fr}
  .content{padding:20px 16px 44px}
  .topbar{padding:10px 16px}
}
.drop{display:flex;align-items:center;gap:16px;border:2px dashed var(--rule);border-radius:14px;padding:18px 20px;background:var(--paper);flex-wrap:wrap}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.tbl-scroll{max-height:560px;overflow:auto}
.tbl-scroll thead th{position:sticky;top:0;background:var(--sheet);z-index:1}
#busy{position:fixed;inset:0;background:rgba(20,25,40,.35);display:grid;place-items:center;z-index:60}
.busy-card{background:var(--sheet);border-radius:16px;padding:28px 34px;text-align:center;min-width:280px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--navy);margin:0 auto 14px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.grid-p1{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media (max-width:1150px){.grid-p1{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<body>
<div class="app">
  <aside>
    <div class="brand"><span class="o" aria-hidden="true"></span>neFinger</div>
    <div class="brand-sub">제안 작업실 · 시안</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">시안입니다. 공고문 분석은 실제로 동작하고, 나머지는 샘플 데이터입니다. 새로고침하면 처음 상태로 돌아갑니다.</div>
  </aside>
  <main>
    <div class="topbar" id="topbar"></div>
    <div class="content" id="view"></div>
  </main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const TODAY = '2026-10-23';
const PHASES = [
  {code:'P1', name:'RFP 분석', out:['trace.csv','ins.csv','facts.json','rules.json','분석 워크북.xlsx'], gate:'요구사항 ID 전건 등재', tools:['trace_matrix.py extract','instructions.py extract'], lock:null,
   todo:['RFP·공고문 올리기','요구사항 목록 뽑기','작성 지시 목록 뽑기','이번 사업 금칙어·확정값 넣기','감점·실격 조항 따로 정리']},
  {code:'P2', name:'전략·스토리보드', out:['전략수립.xlsx','strategy.json','스토리보드.xlsx'], gate:'S0·S1 0건, 요구사항 100% 배정', tools:['strategy_check.py','storyboard.py check'], lock:null,
   todo:['발주사가 제일 걱정하는 것 3~5개 정하기','경쟁사 비교표 채점','장표별 주제문·근거 쓰기','매수 합계가 상한 이하인지 확인']},
  {code:'P3', name:'장표 틀 구축', out:['디자인 킷','데모 3매.pdf'], gate:'데모 3매 검증 통과', tools:['deck_qa.py --profile a4_port'], lock:'틀 잠금',
   todo:['템플릿 좌표 실측','색·글꼴 확정','데모 3매 만들어 육안 확인','회사 식별 요소를 마스터·푸터·파일속성에만 두기']},
  {code:'P4', name:'원고 확정', out:['원고/1장.md','원고/2장.md','원고/3장.md'], gate:'확인 필요 0건, 수치 전건 일치', tools:['consistency_check.py'], lock:'원고 잠금',
   todo:['장별 원고 쓰기','수치를 확정값과 대조','확인 필요 항목 모두 결정']},

}

/* ---------- RFP 분석 엔진: proposal-full-pipeline P1 규칙(trace_matrix·instructions)을 브라우저로 옮긴 것 ---------- */
const ID_PAT = '(?<![A-Za-z0-9.\\-])[A-Z]{2,4}-\\d{2,4}(?![0-9])';
const DENY = new Set(['SHA','AES','RSA','TLS','SSL','ISO','IEC','KS','CVE','CWE','RFC','UTF','ARIA','SEED','LSH','HAS','ECC','DES','PCI','NIST','SP','MD','HTTP','IPV','WCAG','KWCAG','OAS','API','GPT','LTE','USB','DDR','RAID','COVID']);
const LABELS = ['명칭','요구사항명칭','고유번호','요구사항고유번호'];
const NAME_LABEL = /^(?:요구사항\s*)?명\s*칭\s*[|:：]?\s*(.+)$/;
const normS = s => String(s||'').replace(/[\s·ㆍ․,.()（）\/|]/g,'');
const trimSet = s => s.replace(/^[\s.·:\-]+|[\s.·:\-]+$/g,'');
const cleanName = n => trimSet(String(n||'').split(/\s{2,}|\||\t/)[0].replace(/^[▢■□○●◦ｏ※·.:\- ]+/,'')).slice(0,40);

function extractIds(units){
  const rx = new RegExp(`(${ID_PAT})\\s*[.:：|\\-]?\\s*(.{0,60})`,'g'), idre = new RegExp(ID_PAT);
  const pref = [0]; units.forEach(u => pref.push(pref.at(-1) + (idre.test(u.t) ? 1 : 0)));
  const dens = i => pref.at(Math.min(units.length, i + 9)) - pref.at(Math.max(0, i - 8));
  const cand = {}, detail = {};
  units.forEach((u, idx) => {
    for (const m of u.t.matchAll(rx)) {
      const rid = m[1];
      if (/-0+$/.test(rid) || DENY.has(rid.split('-')[0])) continue;
      let name = cleanName(m[2].trim());
      if (!name && idx + 1 < units.length) { const nx = units.at(idx + 1).t; if (!idre.test(nx) && !LABELS.includes(normS(nx))) name = cleanName(nx); }
      if (LABELS.includes(normS(name)) || /^요구사항\s*(?:명칭|고유번호)/.test(name)) name = '';
      (cand[rid] ||= []).push([dens(idx), idx, u.loc, name]);
      if (detail[rid]) continue;
      const look = units.slice(idx + 1, idx + 6);
      for (let j = 0; j < look.length; j++) {
        const nxt = look.at(j).t, cells = nxt.replace(/^\||\|$/g,'').split('|').map(c => c.trim()), lab = normS(cells[0]);
        const inline = cells.length === 1 ? nxt.match(NAME_LABEL) : null;
        if (lab === '명칭' || lab === '요구사항명칭' || inline) {
          let dn = '';
          if (inline) dn = cleanName(inline[1]);
          else if (cells.length > 1 && cells[1]) dn = cleanName(cells[1]);
          else if (j + 1 < look.length) dn = cleanName(look.at(j + 1).t);
          if (dn) detail[rid] = [dn, look.at(j).loc];
          break;
        }
        if (idre.test(nxt)) break;
      }
    }
  });
  return Object.keys(cand).sort().map(rid => {
    const occ = cand[rid], named = occ.filter(o => o[3]).length ? occ.filter(o => o[3]) : occ;
    const best = named.reduce((a, b) => (b[0] > a[0] || (b[0] === a[0] && b[1] < a[1])) ? b : a);
    const r = {요구사항ID:rid, 원문명칭:best[3], 상세명칭:'', 원문위치:best[2], 제안서목차:'', 배점항목:'', 배정매수:'', 장표번호:'', 상태:'미착수', 비고:''};
    if (detail[rid]) { r.상세명칭 = detail[rid][0]; r.원문위치 += ' / 상세 ' + detail[rid][1]; if (normS(r.상세명칭) !== normS(r.원문명칭)) r.비고 = '목록·상세 명칭 상이 — 질의 대상'; }
    else if (occ.length === 1) r.비고 = '1회 출현·상세 없음 — 요구사항 ID 여부 확인';
    return r;
  });
}

const INS_START = /제안서\s*(?:의\s*)?작성\s*(?:요령|지침|방법|안내|기준)/;
const INS_END = /^(?:[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\.|\d+\.)?\s*(?:안내\s*사항|붙\s*임\s*\d?$|별\s*첨\s*$|\[?관련\s*서식)|^\|?\s*붙임\s*\d/;
const TOC_LINE = /\s\d{1,3}\s*$/, ROMAN = /^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+|I{1,3}|IV|VI{0,3}|IX|X)\.\s*(\S.*)$/, NUMH = /^(\d{1,2})\.\s*(\S.*)$/, TOC_START = /목\s*차/;
const DIRECTIVE = /하여야|해야|할\s*것|바람|한다|함\.?$|하며|제출|기재|표기|명시|작성|첨부|포함|금지|불가|이내|내외|원칙|권고|권장|준수|않도록|간주|사용/;
const CATS = [
  ['분량', /\d[\d,]*\s*(?:페이지|쪽|장|매)\s*(?:\(\s*\d+\s*장\s*\)\s*)?(?:이내|내외|를\s*넘지|초과|미만)/],
  ['용량', /\d+\s*MB/i], ['표현', /모호|명확한\s*용어|할\s*수\s*있다/], ['금지', /금지|하지\s*말\s*것|배제|불가(?!능)/],
  ['표기', /조견표|일련번호|쪽\s*번호|페이지\s*번호|약어|출처|참고문헌|해당\s*사항\s*없음|별표\s*\(\*\*\)|\*\*/],
  ['형식', /A4|용지|종\s*방향|횡\s*방향|종방향|횡방향|제본|흑백|컬러|색도|표지|백상지|스노우지|PDF|HWP|한글|워드|파워포인트|번호\s*체계|글꼴|폰트/i],
  ['서식', /서식|붙임\s*\d|별지\s*제?\s*\d|별표\s*\d/], ['제출', /제출|\d+\s*부|원본|사본|별첨|별봉/],
];
const normI = s => String(s||'').replace(/[\s·ㆍ.,()（）\[\]「」『』"'“”‘’\/~\-]/g,'');
const classify = t => (CATS.find(([, rx]) => rx.test(t)) || ['작성내용'])[0];

function extractIns(raw){
  const U = [];
  raw.forEach(u => { const t = u.t.trim(); const cells = t.startsWith('|') ? t.replace(/^\||\|$/g,'').split('|').map(c => c.trim()) : [t];
    cells.forEach(c => c.split(/\s+\/\s+/).forEach(part => { part = part.trim(); if (part) U.push({loc:u.loc, t:part}); })); });
  const start = U.findIndex(u => INS_START.test(u.t) && !TOC_LINE.test(u.t) && u.t.length < 60);
  if (start < 0) return {items:[], range:null};
  let end = U.findIndex((u, i) => i > start && INS_END.test(u.t)); if (end < 0) end = Math.min(U.length, start + 800);
  const scope = U.slice(start, end), items = [], seen = new Set(), tocIx = {};
  let inToc = false, roman = '', parentSoft = false, lastNum = 0;
  const toc = (key, label, title, loc) => { if (key in tocIx) { const it = items[tocIx[key]]; if (normI(it.crit) !== normI(title) && !it.memo.includes(title)) it.memo = (it.memo ? it.memo + ' / ' : '다른 표기: ') + title; return; }
    tocIx[key] = items.length; items.push({cat:'목차', text:label, loc, auto:'자동', crit:title, target:'본문', memo:''}); };
  for (const {loc, t} of scope.slice(1)) {
    if (!/^[-∙·※*]/.test(t)) parentSoft = /권장|권고/.test(t);
    if (TOC_START.test(t) && t.length < 30) { inToc = true; continue; }
    const mr = t.match(ROMAN), mn = t.match(NUMH);
    if (inToc && mr && t.length < 40) { roman = mr[1]; lastNum = 0; toc(roman + '|', t, mr[2].trim(), loc); continue; }
    if (inToc && mn && roman && +mn[1] <= lastNum) inToc = false;
    if (inToc && mn && roman && t.length < 50 && !DIRECTIVE.test(mn[2].slice(-6))) { const title = mn[2].trim(); lastNum = +mn[1]; toc(roman + '|' + mn[1], `${roman}.${mn[1]} ${title}`, title, loc); continue; }
    if (t.length < 8 || !DIRECTIVE.test(t)) continue;
    if (/^[□■]/.test(t) && t.length < 25) continue;
    const cat = classify(t), key = cat + normI(t).slice(0, 60);
    if (seen.has(key)) continue; seen.add(key);
    let crit = '', target = '본문';
    if (cat === '분량') { crit = t.match(/(\d[\d,]*)\s*(?:페이지|쪽|장|매)/)[1].replace(/,/g,''); target = t.includes('요약') ? '요약' : t.includes('발표') ? '발표' : '본문'; if (/양면/.test(t) && t.includes('장') && !t.includes('페이지')) crit = String(+crit * 2); }
    else if (cat === '용량') { crit = t.match(/(\d+)\s*MB/i)[1]; target = 'PDF'; }
    else if (cat === '표기' && t.includes('조견표')) crit = '조견표';
    const auto = (cat === '분량' || cat === '용량' || crit === '조견표') ? '자동' : '수기';
    const soft = cat !== '용량' && (/권장|권고/.test(t) || (parentSoft && /^[-∙·]/.test(t)));
    if (soft && crit) crit += ' (권장)';
    items.push({cat, text:t.slice(0, 200), loc, auto, crit, target, memo:''});
  }
  return {items, range:[U.at(start).t.slice(0, 30), U.at(end - 1).t.slice(0, 30), scope.length]};
}

const PEN = /감점|실격|무효|부적격|탈락|입찰\s*참가\s*자격.*제한|평가\s*(?:대상\s*)?제외|대상에서\s*제외|불이익|0점\s*처리/;
function extractPenalties(units){
  const out = [], seen = new Set();
  units.forEach(u => { const t = u.t.trim(); if (t.length < 10 || t.length > 300 || !PEN.test(t)) return; const k = normI(t).slice(0, 50); if (seen.has(k)) return; seen.add(k);
    const kind = /실격|무효|부적격|탈락|제외/.test(t) ? '실격·무효' : '감점'; out.push({kind, text:t, loc:u.loc}); });
  return out;
}
function detectSummary(units){
  const find = rx => { for (let k = 0; k < units.length; k++) { const u = units.at(k), m = u.t.match(rx); if (!m) continue;
      if (m[1] && trimSet(m[1]).length > 1) return {v:trimSet(m[1]).slice(0, 80), loc:u.loc};
      const nx = units.at(k + 1); if (nx && nx.t.length > 1 && nx.t.length < 120) return {v:trimSet(nx.t).slice(0, 80), loc:nx.loc}; } return null; };
  const s = {
    name: find(/^\s*사\s*업\s*명\s*[:：|]?\s*(.*)$/),
    period: find(/^\s*(?:사업|계약|용역)\s*기간\s*[:：|]?\s*(.*)$/),
    budget: find(/^\s*(?:사업\s*예산|추정\s*금액|추정\s*가격|사업\s*금액|기초\s*금액|배정\s*예산)\s*[:：|]?\s*(.*)$/),
    client: find(/^\s*(?:발\s*주\s*기\s*관|수\s*요\s*기\s*관|발\s*주\s*처)\s*[:：|]?\s*(.*)$/),
  };
  for (const u of units) { if (!/(?:제출|접수|입찰)\s*마감|마감\s*일시|제출\s*기한|제안서\s*제출/.test(u.t)) continue;
    const m = u.t.match(/(20\d{2})\s*[.\-년\/]\s*(\d{1,2})\s*[.\-월\/]\s*(\d{1,2})/); if (m) { s.deadline = {v:`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`, loc:u.loc}; break; } }
  return s;
}

async function readUnits(file){
  const ext = file.name.split('.').pop().toLowerCase(), tag = file.name;
  if (ext === 'pdf') {
    if (!window.pdfjsLib) throw new Error('PDF 판독기를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, out = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent(), lines = new Map();
      tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5] / 3); if (!lines.has(y)) lines.set(y, []); lines.get(y).push({x:it.transform[4], s:it.str, w:it.width}); });
      [...lines.entries()].sort((a, b) => b[0] - a[0]).forEach(([, arr]) => { arr.sort((a, b) => a.x - b.x); let t = '', last = null;
        arr.forEach(a => { if (last !== null) { const g = a.x - last; t += g > 12 ? '  ' : g > 1.5 ? ' ' : ''; } t += a.s; last = a.x + a.w; });
        t = t.trim(); if (t) out.push({loc:`${tag} p.${p}`, t}); });
    }
    return {units:out, pages:pdf.numPages};
  }
  if (ext === 'hwpx') {
    if (!window.JSZip) throw new Error('HWPX 판독기를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const names = Object.keys(zip.files).filter(n => /Contents\/section\d+\.xml$/i.test(n)).sort((a, b) => +a.match(/(\d+)\.xml/i)[1] - +b.match(/(\d+)\.xml/i)[1]);
    if (!names.length) throw new Error('HWPX 본문을 찾지 못했습니다.');
    const out = [];
    for (const [si, n] of names.entries()) {
      const xml = new DOMParser().parseFromString(await zip.file(n).async('string'), 'application/xml'); let k = 0;
      for (const p of xml.getElementsByTagNameNS('*', 'p')) {
        let t = ''; for (const te of p.getElementsByTagNameNS('*', 't')) { let a = te.parentNode; while (a && a.localName !== 'p') a = a.parentNode; if (a === p) t += te.textContent; }
        t = t.trim(); k++; if (t) out.push({loc:`${tag} 구역${si + 1} 문단${k}`, t});
      }
    }
    return {units:out};
  }
  if (ext === 'docx') {
    if (!window.mammoth) throw new Error('DOCX 판독기를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    const r = await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {units:r.value.split(/\n+/).map((t, i) => ({loc:`${tag} 문단${i + 1}`, t:t.trim()})).filter(u => u.t)};
  }
  if (ext === 'txt' || ext === 'md' || ext === 'csv') {
    return {units:(await file.text()).split(/\r?\n/).map((t, i) => ({loc:`${tag} ${i + 1}행`, t:t.trim()})).filter(u => u.t)};
  }
  if (ext === 'hwp') throw new Error('HWP(구버전 한글)는 브라우저에서 읽을 수 없습니다. 한글에서 HWPX나 PDF로 저장해 올려 주세요. (실제 서비스에서는 서버의 스킬 실행기가 읽습니다)');
  throw new Error('지원하지 않는 형식입니다 (PDF · HWPX · DOCX · TXT)');
}

async function analyzeFiles(files, onStep){
  const fileInfo = [], units = [];
  for (const f of files) {
    onStep && onStep(`${f.name} 읽는 중…`);
    try { const r = await readUnits(f); fileInfo.push({name:f.name, size:f.size, units:r.units.length, pages:r.pages || null, err:''}); r.units.forEach(u => units.push(u)); }
    catch (e) { fileInfo.push({name:f.name, size:f.size, units:0, err:e.message || String(e)}); }
  }
  onStep && onStep('요구사항·작성 지시 추출 중…');
  await new Promise(r => setTimeout(r, 30));
  const reqs = extractIds(units), ins = extractIns(units), pens = extractPenalties(units), summary = detectSummary(units);
  return {files:fileInfo, units, reqs, ins:ins.items, insRange:ins.range, pens, summary, at:nowStamp()};
}

function applyAnalysis(p, an){
  S.an[p.id] = an;
  const f = S.findings[p.id] = (S.findings[p.id] || []).filter(x => !x.fromRfp);
  an.reqs.filter(r => r.비고.startsWith('목록')).forEach(r => f.push({id:S.nextId++, sev:'S1', rule:'원문 명칭 상이', where:r.요구사항ID, msg:`목록 “${r.원문명칭}” ↔ 상세 “${r.상세명칭}” — 발주처 질의 대상`, state:'new', fromRfp:true}));
  an.reqs.filter(r => r.비고.startsWith('1회')).forEach(r => f.push({id:S.nextId++, sev:'S2', rule:'ID 여부 확인', where:r.요구사항ID, msg:'한 번만 나오고 상세 설명이 없음 — 요구사항 ID가 맞는지 확인', state:'new', fromRfp:true}));
  an.ins.filter(x => x.cat === '목차' && x.memo).forEach(x => f.push({id:S.nextId++, sev:'S1', rule:'RFP 목차 표기 불일치', where:x.text, msg:x.memo, state:'new', fromRfp:true}));
  an.files.filter(x => x.err).forEach(x => f.push({id:S.nextId++, sev:'S2', rule:'판독 실패', where:x.name, msg:'종료코드 3 — ' + x.err, state:'new', unread:true, fromRfp:true}));
  const ok = an.files.some(x => !x.err);
  S.runs[p.id].push({tool:'trace_matrix.py extract', at:an.at, code: an.files.some(x=>x.err) ? 3 : an.reqs.length ? 0 : 1, by:'양영선', msg:`요구사항 ${an.reqs.length}건 추출`});
  S.runs[p.id].push({tool:'instructions.py extract', at:an.at, code: !ok ? 3 : an.ins.length ? 0 : 1, by:'양영선', msg: an.insRange ? `작성 지시 ${an.ins.length}건 추출` : '‘제안서 작성 요령/지침’ 장을 찾지 못함'});
}

function dlCsv(name, cols, rows){
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = '\ufeff' + [cols.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

async function runAnalysis(files, targetPid){
  busy('파일을 준비하는 중…');
  try {
    const an = await analyzeFiles(files, m => busy(m));
    let p = targetPid ? S.projects.find(x => x.id === targetPid) : null;
    if (!p) {
      const id = 'n' + S.nextId++, s = an.summary;
      const dl = s.deadline && Date.parse(s.deadline.v) >= Date.parse(TODAY) ? s.deadline.v : new Date(Date.parse(TODAY) + 14 * 864e5).toISOString().slice(0, 10);
      p = {id, name: (S.pendingName || (s.name && s.name.v) || files[0].name.replace(/\.[^.]+$/, '')).slice(0, 60), client: S.pendingClient || (s.client && s.client.v) || '발주기관 미확인', no:'공고번호 미입력', route:'전체', deadline:dl, pages:100, sampleLeft:true,
        phases:ph(PHASES.map((_, i) => i === 0 ? ['active'] : ['waiting']))};
      S.projects.push(p); S.openItems[id] = []; S.comments[id] = []; S.changes[id] = []; S.runs[id] = []; S.chat[id] = []; S.findings[id] = [];
    }
    applyAnalysis(p, an);
    busy(false); S.pid = p.id; S.anTab = 'req'; S.pendingName = S.pendingClient = '';
    toast(`분석 완료 · 요구사항 ${an.reqs.length}건, 작성 지시 ${an.ins.length}건`);
    go('work', {workPhase:0});
  } catch (e) { busy(false); toast('분석하지 못했습니다: ' + (e.message || e)); }
}
document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files.length) runAnalysis([...e.dataTransfer.files], S.pid); });
document.addEventListener('change', e => { if (e.target.id === 'rfpfile' && e.target.files.length) runAnalysis([...e.target.files], S.pid); });

render();
</script>
</body>
